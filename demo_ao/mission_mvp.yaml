# MVP mission (2026-09-23). The demo AO with two decisions applied, both documented
# in droneplanner/CLAUDE.md -> "MVP MISSION":
#   covered_radius_m 1500 — concealment only for the first part (user, 2026-09-14);
#     1500 m is the largest zone that closes on one battery at EVERY density the
#     onboard planner has been shown to fly (tools/concealment_zone_study.py).
#   stem.density_per_ha 200 — the density of the Gazebo forest this is flown in
#     (gz-world --stems-per-ha 200 --forest-radius 1500), so speed and endurance are
#     priced for the world actually flown, not the canopy-height inference.

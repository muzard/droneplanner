# Example mission for the droneplanner CLI (Software-Spec §4).
#   droneplanner plan --mission configs/mission.example.yaml --out out/
#
# Coordinates may be given either as projected {x, y} in `crs` (as below) or as
# WGS84 {lon, lat} (converted to `crs` on load). `crs` MUST be a projected
# metric CRS (meters) — here UTM zone 33N.

name: example-ao
crs: EPSG:32633

# Projected easting/northing in the working CRS (meters). ~3.6 km apart.
start: { x: 500000.0, y: 5200000.0 }
end: { x: 502500.0, y: 5202600.0 }

drone:
  rotor_span_m: 0.9
  mass_kg: 6.5
  min_turn_radius_m: 8.0
  climb_rate_max_ms: 3.0
  descent_rate_max_ms: 2.0
  cruise_speed_ms: 6.0

spool:
  length_m: 5000.0
  mass_kg: 1.2
  payout_side: drone

# Passive survivability input only (Software-Spec §8): no targeting logic.
threat:
  observers:
    - { x: 501200.0, y: 5201000.0 }
  sectors:
    - azimuth_start_deg: 30.0
      azimuth_end_deg: 90.0
      label: ridge-observer

weights:
  exposure: 1.0
  cover: 1.0
  length: 0.5
  survivability: 1.0
  snag: 0.5

# Map layers are omitted here — the M0 stub plans a straight line and the report
# flags that concealment/flyability analysis was not performed. Add from M1:
# layers:
#   dtm: data/example/dtm.tif
#   dsm: data/example/dsm.tif
#   point_cloud: data/example/ao.laz
#   roads: data/example/roads.geojson

k_routes: 1
seed: 42

# Planner defaults (tunable):
# waypoint_spacing_m is what makes low flight possible: PX4 drives toward the next
# waypoint's altitude at its own vertical rate, so between distant waypoints the
# commanded profile cannot track the ground. Keep it near the DTM's cell size.
waypoint_spacing_m: 25.0
# A *target* height above terrain, not a cruise altitude to hold: the planner flies
# this low wherever the floor and the canopy ceiling allow.
cruise_agl_m: 10.0
fiber_slack_factor: 1.05

# How low to fly, and what stops it going lower. The drone hides UNDER the canopy —
# a fixed 30 m AGL clears a 22 m stand by 8 m and is a silhouette against sky.
altitude:
  min_agl_m: 5.0           # floor: understory, rotor wash, DTM error
  canopy_clearance_m: 3.0  # gap kept below the crowns (and above them when skimming)
  min_canopy_m: 12.0       # only stands at least this tall are entered

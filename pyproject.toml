[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droneplanner"
version = "0.1.0"
description = "Offline preflight route planner for the autonomous fiber-laying drone (concealment-, flyability-, and survivability-aware)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DroneAutomation" }]

# Core dependencies. All permissive (BSD/MIT/Apache); see THIRD_PARTY.md.
# GPL tools (GRASS, etc.) are process/CLI-boundary only and are NOT listed here.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "scikit-image>=0.22",
    "networkx>=3.2",
    "laspy>=2.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# `pdal` needs the system PDAL C++ library and is not reliably pip-installable;
# install it via conda/system packages for the forest (M2) point-cloud path.
forest = ["pdal>=3.2"]
viz = ["folium>=0.16"]
accel = ["numba>=0.59"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "pre-commit>=3.7",
]

[project.scripts]
droneplanner = "droneplanner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
droneplanner = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N802", "N803", "RUF059"]
# Typer requires the Option/Argument call in the parameter default.
"src/droneplanner/cli.py" = ["B008"]
# serve.py embeds an HTML/JS template string with long lines.
"src/droneplanner/serve.py" = ["E501"]

[tool.mypy]
# Parse as 3.12 so modern third-party stubs (numpy) that use the `type`
# statement type-check cleanly. Runtime support stays 3.11+ (requires-python);
# ruff's py311 target guards against any 3.12-only syntax in our code.
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true
show_error_codes = true

# Third-party libraries without type stubs. Strict typing still applies to our
# code. (M1 adds shapely/scipy/scikit-image/networkx here as they get imported.)
[[tool.mypy.overrides]]
module = [
    "rasterio.*",
    "geopandas.*",
    "pyproj.*",
    "laspy.*",
    "scipy.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["droneplanner"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
